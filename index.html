<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf2ff">
<title>Xozen — Asisten AI Cerdas untuk Semua Kebutuhanmu</title>
<meta name="description" content="Tanya, rancang, tulis, dan buat file otomatis dengan Xozen. Gratis 5.000 xoz saat daftar + 1.500 xoz setiap hari.">
<link rel="icon" type="image/png" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f9ff;
  --surface:rgba(255,255,255,.76);
  --surface-strong:rgba(255,255,255,.92);
  --surface-soft:#eef4ff;
  --ink:#13264d;
  --ink-2:#354a73;
  --mute:#5d7096;
  --acc:#2563eb;
  --acc-2:#0ea5e9;
  --acc-soft:rgba(37,99,235,.09);
  --line:rgba(24,52,110,.09);
  --line-strong:rgba(37,99,235,.22);
  --sh-sm:0 4px 16px rgba(20,50,115,.06);
  --sh-md:0 14px 36px rgba(20,50,115,.09),inset 0 1px 0 rgba(255,255,255,.92);
  --sh-lg:0 24px 56px rgba(20,50,115,.13),inset 0 1px 0 rgba(255,255,255,.95);
  --ease:cubic-bezier(.22,1,.36,1);
  --radius:22px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{
  font:16px/1.6 var(--font);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* ===== SOFT AMBIENT AURORA BACKGROUND (GPU-friendly) ===== */
.ambient{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#e4efff 0%,#f2f7ff 42%,#fafcff 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55;will-change:transform;animation:drift var(--dur,18s) ease-in-out infinite alternate}
.blob.b1{width:54vmax;height:54vmax;top:-22vmax;left:-10vmax;background:radial-gradient(circle,rgba(59,130,246,.38),rgba(59,130,246,0) 70%);--dur:20s;--tx:6vw;--ty:4vh}
.blob.b2{width:46vmax;height:46vmax;top:12vh;right:-16vmax;background:radial-gradient(circle,rgba(56,189,248,.30),rgba(56,189,248,0) 70%);--dur:24s;--tx:-5vw;--ty:6vh}
.blob.b3{width:44vmax;height:44vmax;bottom:-18vmax;left:18vw;background:radial-gradient(circle,rgba(99,102,241,.20),rgba(99,102,241,0) 70%);--dur:22s;--tx:4vw;--ty:-5vh}
@keyframes drift{to{transform:translate3d(var(--tx,3vw),var(--ty,3vh),0) scale(1.06)}}

/* Subtle dot grid texture */
.grid-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(37,99,235,.09) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse 80% 55% at 50% 18%,#000 20%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 18%,#000 20%,transparent 85%);
}

/* Scroll progress hairline */
#sp{position:fixed;top:0;left:0;height:2.5px;width:100%;z-index:60;background:linear-gradient(90deg,var(--acc),var(--acc-2));transform:scaleX(0);transform-origin:left;pointer-events:none}

/* Container */
.w{width:100%;max-width:1120px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.w{padding:0 28px}}

/* ===== HEADER / NAVBAR ===== */
header{position:sticky;top:0;z-index:40;padding:12px 0 0;transition:transform .4s var(--ease)}
header.hide{transform:translateY(-130%)}
.nav-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.92);
  border-radius:999px;
  padding:7px 8px 7px 16px;
  box-shadow:0 8px 28px rgba(20,50,115,.08),inset 0 1px 0 #fff;
}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:18.5px;letter-spacing:-.03em;margin-right:auto}
.brand img{height:25px;width:auto}
.nav-links{display:none;align-items:center;gap:2px}
.nav-links a{padding:8px 15px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--mute);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink);background:rgba(37,99,235,.06)}
.nav-links a.on{color:var(--acc);background:rgba(37,99,235,.1);font-weight:600}

/* Language pill */
.lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:rgba(20,50,115,.06);border:1px solid var(--line)}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(20,50,115,.12);transition:transform .32s var(--ease)}
.lang[data-v=en]::before{transform:translateX(100%)}
.lang button{position:relative;z-index:1;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--mute);transition:color .2s}
.lang button.on{color:var(--acc)}
.pcl{display:none}

/* Buttons */
.btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 22px;border-radius:999px;
  font-size:14.5px;font-weight:600;white-space:nowrap;
  background:var(--surface-strong);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--sh-sm);
  transition:transform .22s var(--ease),box-shadow .22s,background .22s,border-color .22s;
}
.btn:hover{transform:translateY(-1.5px);box-shadow:var(--sh-md);border-color:var(--line-strong)}
.btn:active{transform:scale(.97)}
.btn.pri{
  background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);
  color:#fff;border-color:rgba(255,255,255,.22);
  box-shadow:0 8px 22px rgba(37,99,235,.26);
}
.btn.pri:hover{box-shadow:0 12px 28px rgba(37,99,235,.34)}
.btn.pri::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);
  transform:translateX(-120%);animation:shine 5s ease-in-out infinite;pointer-events:none;
}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
header .btn{min-height:38px;padding:0 16px;font-size:13.5px}

/* Mobile burger & drawer */
.burger{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.85);flex:none}
.burger i{grid-area:1/1;width:16px;height:1.8px;background:var(--ink);border-radius:2px;transition:transform .28s var(--ease),opacity .2s}
.burger i:nth-child(1){transform:translateY(-4.5px)}
.burger i:nth-child(3){transform:translateY(4.5px)}
.menu-open .burger i:nth-child(1){transform:rotate(45deg)}
.menu-open .burger i:nth-child(2){opacity:0}
.menu-open .burger i:nth-child(3){transform:rotate(-45deg)}
#scrim{position:fixed;inset:0;z-index:35;background:rgba(15,28,58,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s}
#menu{
  position:absolute;left:18px;right:18px;top:68px;z-index:45;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:12px;
  box-shadow:var(--sh-lg);
  opacity:0;transform:translateY(-10px) scale(.98);transform-origin:top;pointer-events:none;
  transition:opacity .26s,transform .32s var(--ease);
}
#menu a{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border-radius:14px;font-weight:600;font-size:15.5px;color:var(--ink-2)}
#menu a:active,#menu a.on{background:var(--acc-soft);color:var(--acc)}
#menu .m-lang{display:flex;justify-content:center;padding:4px 0 10px}
#menu .btn{width:100%;margin-top:8px}
.menu-open #scrim{opacity:1;pointer-events:auto}
.menu-open #menu{opacity:1;transform:none;pointer-events:auto}

@media(min-width:860px){
  .nav-links{display:flex}
  .pcl{display:inline-grid}
  .burger,#menu,#scrim{display:none!important}
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  min-height:calc(100vh - 72px);
  min-height:calc(100svh - 72px);
  padding:40px 0 64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
@media(min-width:768px){.hero{padding:48px 0 76px}}
.hero-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px 6px 8px;border-radius:999px;
  background:var(--surface-strong);border:1px solid var(--line);
  box-shadow:var(--sh-sm);font-size:13px;font-weight:600;color:var(--ink-2);
  margin-bottom:22px;
}
.hero-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(37,99,235,.16);animation:pulseDot 2.2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.85);opacity:.65}}
.hero-orb{
  width:78px;height:78px;border-radius:24px;
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 14px 34px rgba(37,99,235,.14),inset 0 1px 0 #fff;
  display:grid;place-items:center;margin-bottom:22px;
  animation:floatOrb 5.5s ease-in-out infinite;
}
.hero-orb img{height:44px;width:auto}
@keyframes floatOrb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

h1{
  font-size:clamp(32px,7.2vw,62px);
  line-height:1.07;letter-spacing:-.04em;font-weight:800;
  max-width:16ch;margin:0 auto;
}
h1 em,h2 em{
  font-style:normal;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 52%,#0284c7 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{
  color:var(--mute);font-size:clamp(15.5px,2.2vw,18.5px);
  max-width:52ch;margin:16px auto 28px;line-height:1.65;
}

/* Interactive Prompt Box */
.ask{
  width:100%;max-width:660px;
  display:flex;align-items:flex-end;gap:10px;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(37,99,235,.18);
  border-radius:26px;padding:9px 9px 9px 20px;
  box-shadow:0 16px 42px rgba(24,52,110,.11),inset 0 1px 0 #fff;
  transition:transform .28s var(--ease),box-shadow .28s,border-color .28s;
}
.ask:focus-within{
  transform:translateY(-2px);
  border-color:rgba(37,99,235,.42);
  box-shadow:0 0 0 5px rgba(37,99,235,.10),0 22px 52px rgba(24,52,110,.15);
}
.qw{position:relative;flex:1;min-width:0}
#q{
  display:block;width:100%;border:0;background:none;resize:none;
  font:16px/1.5 var(--font);color:var(--ink);
  padding:8px 0;min-height:42px;max-height:140px;outline:none;
}
.ph{
  position:absolute;left:0;right:0;top:9px;text-align:left;
  color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;transition:opacity .2s;font-size:15.5px;
}
#q:not(:placeholder-shown)+.ph{opacity:0}
.ph::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--acc);margin-left:2px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
.ask:focus-within .ph::after{display:none}
@keyframes blink{50%{opacity:0}}
.go{
  flex:none;width:42px;height:42px;border-radius:50%;
  background:rgba(37,99,235,.42);color:#fff;
  display:grid;place-items:center;
  transition:background .22s,transform .22s var(--ease),box-shadow .22s;
}
.go svg{width:19px;height:19px}
.ask.has .go{background:var(--acc);transform:scale(1.04);box-shadow:0 6px 18px rgba(37,99,235,.34)}
.ask.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;max-width:680px}
.chip{
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh-sm);transition:transform .2s var(--ease),background .2s,border-color .2s,color .2s;
}
.chip:hover{transform:translateY(-1.5px);background:#fff;border-color:var(--line-strong);color:var(--acc)}
.chip:active{transform:scale(.96)}
.hero-note{margin-top:14px;font-size:13.5px;color:var(--mute)}

/* Hero intro animation */
.hero-in{opacity:0;transform:translateY(16px);animation:heroUp .75s var(--ease) var(--hd,0s) forwards}
@keyframes heroUp{to{opacity:1;transform:none}}

/* ===== SECTIONS ===== */
section{padding:84px 0}
@media(min-width:768px){section{padding:124px 0}}
.sec-hd{margin-bottom:28px}
.sec-hd.c{text-align:center}
.sec-hd.c .sub{margin-left:auto;margin-right:auto}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc);background:var(--acc-soft);padding:5px 12px;border-radius:999px;margin-bottom:12px;
}
h2{font-size:clamp(25px,4.6vw,40px);line-height:1.15;letter-spacing:-.03em;font-weight:800}
h3{font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.015em}
.sub{color:var(--mute);font-size:clamp(15px,1.8vw,16.5px);max-width:56ch;margin-top:10px}

/* ===== CARDS ===== */
.card{
  position:relative;isolation:isolate;
  background:var(--surface);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:var(--radius);padding:22px;
  box-shadow:var(--sh-md);
  transition:transform .28s var(--ease),box-shadow .28s,border-color .28s;
}
.card::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.85),transparent 65%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
@media(hover:hover){
  .card.lift:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:rgba(37,99,235,.22)}
  .card.lift:hover::before{opacity:1}
}
.card p{color:var(--mute);font-size:14.5px;margin-top:6px;line-height:1.58}

/* Stats Row */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr);gap:16px}}
.stat-card{text-align:left;padding:20px 22px}
.stat-card b{display:block;font-size:clamp(28px,4.2vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
.stat-card p{margin-top:4px;font-size:13.5px}

/* ===== INTERACTIVE 4-MODE LIVE STAGE ===== */
.stage-wrap{
  background:var(--surface-strong);
  border:1px solid rgba(255,255,255,.95);
  border-radius:28px;padding:18px;
  box-shadow:var(--sh-lg);
}
@media(min-width:768px){.stage-wrap{padding:26px}}
.stage-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin-bottom:18px}
.stage-tabs::-webkit-scrollbar{display:none}
.stab{
  flex:none;display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  color:var(--mute);background:var(--surface-soft);border:1px solid transparent;
  transition:background .22s,color .22s,border-color .22s,transform .18s;
}
.stab:hover{color:var(--ink)}
.stab.on{background:var(--acc);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.stage-grid{display:grid;grid-template-columns:1fr;gap:20px;align-items:center}
@media(min-width:860px){.stage-grid{grid-template-columns:1fr 1.25fr;gap:30px}}
.stage-copy{animation:stageFade .42s var(--ease)}
@keyframes stageFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stage-copy h3{font-size:clamp(22px,3vw,28px);line-height:1.2;margin-bottom:10px}
.stage-copy p{color:var(--mute);font-size:15px;line-height:1.65;margin-bottom:16px}
.stage-pts{list-style:none;display:flex;flex-direction:column;gap:9px}
.stage-pts li{display:flex;align-items:flex-start;gap:9px;font-size:14.5px;color:var(--ink-2)}
.stage-pts .ck{width:20px;height:20px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;margin-top:2px}

/* Interactive Mockup Window inside Stage */
.mock{
  background:#f8fbff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 12px 32px rgba(20,50,115,.08);
  animation:stageFade .42s var(--ease);
}
.mock-top{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.mock-dots{display:flex;gap:6px}.mock-dots i{width:8px;height:8px;border-radius:50%;background:rgba(20,50,115,.16)}
.mock-body{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.m-user{align-self:flex-end;background:var(--acc);color:#fff;padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:86%;font-weight:500}
.m-ai{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;color:var(--ink)}
.m-qcard{background:#f3f7ff;border:1px solid rgba(37,99,235,.15);border-radius:14px;padding:12px 14px;margin-top:10px}
.m-qopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m-qopt{padding:5px 11px;border-radius:999px;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.m-qopt.on{background:rgba(37,99,235,.12);border-color:rgba(37,99,235,.35);color:var(--acc);font-weight:600}
.m-code{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;font:12.5px/1.6 var(--mono);overflow-x:auto;margin-top:8px}
.m-code .kw{color:#c084fc}.m-code .fn{color:#38bdf8}.m-code .str{color:#4ade80}
.m-fcard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;background:#f8fbff;border:1px solid var(--line);margin-top:8px}
.m-fbadge{padding:4px 8px;border-radius:7px;font:700 11px var(--mono);background:#f7df1e;color:#18181b}
.m-fbadge.html{background:#e34f26;color:#fff}
.m-skill{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.m-skill.on{border-color:rgba(37,99,235,.32);background:#f3f7ff}
.m-sw{width:30px;height:17px;border-radius:999px;background:var(--acc);position:relative;flex:none}
.m-sw::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#fff}
.m-sw.off{background:#cbd5e1}.m-sw.off::after{right:auto;left:2px}
.m-think{border-left:2px solid var(--line-strong);padding-left:10px;color:var(--mute);font-size:12.5px;margin-bottom:8px}

/* Progress bar under stage */
.stage-prog{height:3px;background:rgba(37,99,235,.1);border-radius:99px;overflow:hidden;margin-top:18px}
.stage-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc-2));transition:width .1s linear}

/* ===== BENTO FEATURES ===== */
.bento{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){
  .bento{grid-template-columns:repeat(3,1fr);gap:16px}
  .bento .feat-hl{grid-column:span 2;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(224,238,255,.72))}
}
.f-ico{
  width:40px;height:40px;border-radius:12px;
  background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;margin-bottom:14px;
}
.f-ico svg{width:20px;height:20px}

/* ===== MODELS SHOWCASE ===== */
.models-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.models-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.models-grid{grid-template-columns:repeat(3,1fr)}}
.m-card{display:flex;flex-direction:column;gap:8px}
.m-card.flagship{
  background:linear-gradient(145deg,#102042 0%,#172f61 60%,#0f2752 100%);
  color:#f1f5f9;border-color:rgba(147,197,253,.28);
  box-shadow:0 18px 42px rgba(16,32,66,.22);
}
.m-card.flagship p{color:#bfdbfe}
.m-card.flagship .m-x{color:#38bdf8}
.m-card.flagship .badge{background:rgba(56,189,248,.18);color:#7dd3fc}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-x{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--acc);line-height:1}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.badge.free{background:rgba(20,50,115,.07);color:var(--mute)}

/* ===== 3 STEPS TIMELINE ===== */
.steps{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:768px){.steps{grid-template-columns:repeat(3,1fr);gap:20px}}
.step-num{
  width:36px;height:36px;border-radius:12px;
  background:var(--acc);color:#fff;font-weight:700;font-size:15px;
  display:grid;place-items:center;margin-bottom:14px;
}

/* ===== XOZ LEDGER ===== */
.ledger{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:768px){.ledger{grid-template-columns:repeat(3,1fr);gap:16px}}
.ledger .big{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.03em;margin:8px 0 6px;color:var(--ink)}
.ledger .pro{background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(219,234,254,.72));border-color:rgba(37,99,235,.22)}

/* ===== FAQ (Buttery smooth CSS Grid accordion) ===== */
.faq-list{display:flex;flex-direction:column;gap:10px;max-width:780px;margin:0 auto}
.faq-item{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--sh-sm);overflow:hidden;transition:border-color .2s}
.faq-item.open{border-color:var(--line-strong);background:var(--surface-strong)}
.faq-q{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 20px;text-align:left;font-weight:600;font-size:15.5px;color:var(--ink);
}
.faq-plus{width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:18px;font-weight:400;flex:none;transition:transform .3s var(--ease)}
.faq-item.open .faq-plus{transform:rotate(45deg)}
.faq-a-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.faq-item.open .faq-a-wrap{grid-template-rows:1fr}
.faq-a{overflow:hidden}
.faq-a p{padding:0 20px 18px;color:var(--mute);font-size:14.5px;line-height:1.65}
.faq-a a{color:var(--acc);font-weight:500;text-decoration:underline}

/* ===== FINAL CTA ===== */
.cta-box{
  text-align:center;padding:48px 24px;border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(219,234,254,.72));
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh-lg);
}
.cta-box img{height:54px;margin:0 auto 14px;animation:floatOrb 5.5s ease-in-out infinite}
.cta-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ===== PRICING & BLOG SUBPAGES ===== */
.plans{display:grid;grid-template-columns:1fr;gap:16px;max-width:860px;margin:0 auto}
@media(min-width:720px){.plans{grid-template-columns:1fr 1fr}}
.plan ul{padding-left:18px;color:var(--mute);margin:12px 0 20px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.plan .big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 0}
.tbl-card{padding:8px 20px;overflow-x:auto}
.tr{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tr:last-child{border-bottom:0}
.tr.th{font-size:13px;font-weight:600;color:var(--mute)}
.post-list{display:flex;flex-direction:column;gap:12px;max-width:780px;margin:0 auto}
.post-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px}
.post-card span.arr{color:var(--acc);font-size:20px;transition:transform .25s var(--ease)}
.post-card:hover span.arr{transform:translateX(5px)}
.art{max-width:68ch;margin:0 auto;padding:28px 0 16px}
.art h1{font-size:clamp(26px,5vw,40px);margin:0 0 10px;max-width:none;text-align:left}
.art p,.art li{margin:12px 0;color:var(--ink-2)}
.art ol,.art ul{padding-left:22px}
.art a{color:var(--acc);text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-top:24px;color:var(--acc);font-weight:600}

/* ===== FOOTER ===== */
footer{border-top:1px solid var(--line);padding:26px 0;margin-top:24px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13.5px;color:var(--mute)}
footer .w{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.f-brand{display:inline-flex;align-items:center;gap:8px}
.f-brand img{height:20px;width:auto}

/* ===== SCROLL REVEAL (Smooth once-in stagger) ===== */
[data-r]{opacity:0;transform:translateY(36px);transition:opacity .82s var(--ease) var(--d,0s),transform .82s var(--ease) var(--d,0s)}
[data-r].in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  [data-r],.hero-in{opacity:1!important;transform:none!important}
}
</style>

let stageIdx=0,stageTimer=0,stagePct=0;
function renderStage(){
  const host=$("#stageHost");if(!host)return;
  const s=STAGES[stageIdx]||STAGES[0],k=LANG==="id"?0:1;
  host.innerHTML=`<div class="stage-tabs">${STAGES.map((st,i)=>`<button type="button" class="stab${i===stageIdx?" on":""}" data-st="${i}">${st.tab[k]}</button>`).join("")}</div>
  <div class="stage-grid">
    <div class="stage-copy"><h3>${s.title[k]}</h3><p>${s.desc[k]}</p><ul class="stage-pts">${s.pts.map(pt=>`<li><span class="ck">✓</span><span>${pt[k]}</span></li>`).join("")}</ul></div>
    ${s.mock()}
  </div>
  <div class="stage-prog"><i id="stProg" style="width:${stagePct}%"></i></div>`;
}
function startStageLoop(){
  clearInterval(stageTimer);if(RM)return;
  stagePct=0;
  stageTimer=setInterval(()=>{
    if(!$("#stageHost")||document.hidden)return;
    stagePct+=2;
    const bar=$("#stProg");if(bar)bar.style.width=Math.min(100,stagePct)+"%";
    if(stagePct>=100){stagePct=0;stageIdx=(stageIdx+1)%STAGES.length;renderStage()}
  },120);
}

// ===== ROUTING & INTERACTIONS =====
const SECS=["demo","fitur","model","cara","xoz","faq"];
let io,typerT=0,lastY=0,rafId=0;

const menuToggle=o=>{document.body.classList.toggle("menu-open",o);$("#bg").setAttribute("aria-expanded",o)};
const langButtons=()=>`<button type="button" data-l="id" class="${LANG==="id"?"on":""}">ID</button><button type="button" data-l="en" class="${LANG==="en"?"on":""}">EN</button>`;
function syncLangUI(){document.querySelectorAll(".lang").forEach(l=>{l.dataset.v=LANG;l.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG))})}

function countUp(el){
  if(el.dataset.done)return;el.dataset.done="1";
  const target=+el.dataset.n;if(!target||RM){el.textContent=fmt(target);return}
  const t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/1150);
    el.textContent=fmt(target*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(step);
  })(t0);
}

function initReveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.classList.add("in");
      const n=e.target.querySelector("b[data-n]");if(n)countUp(n);
      io.unobserve(e.target);
    });
  },{threshold:.18,rootMargin:"0px 0px -10% 0px"});
  document.querySelectorAll("[data-r]").forEach(el=>io.observe(el));
}

function startTyper(){
  clearTimeout(typerT);
  const el=$("#ph");if(!el||RM)return;
  const k=LANG==="id"?0:1,list=PROMPTS.map(x=>x.p[k]);
  let i=0,cur=el.textContent,del=1;
  function tick(){
    const qv=$("#q");
    if(!el.isConnected||(qv&&(qv.value||document.activeElement===qv)))return;
    if(del){
      cur=cur.slice(0,-1);el.textContent=cur;
      if(!cur){del=0;typerT=setTimeout(tick,300);return}
      typerT=setTimeout(tick,20);
    }else{
      const w=list[i];cur=w.slice(0,cur.length+1);el.textContent=cur;
      if(cur.length>=w.length){del=1;i=(i+1)%list.length;typerT=setTimeout(tick,1800);return}
      typerT=setTimeout(tick,44);
    }
  }
  typerT=setTimeout(tick,2000);
}

function onScroll(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  $("#sp").style.transform="scaleX("+(max>0?Math.min(1,y/max):0)+")";
  if(document.body.classList.contains("menu-open"))return;
  const H=$("header");
  if(y<70){H.classList.remove("hide");lastY=y}
  else if(Math.abs(y-lastY)>8){H.classList.toggle("hide",y>lastY);lastY=y}
}

function go404(){
  const bad=location.pathname+location.search+location.hash;
  location.replace("404.html?from="+encodeURIComponent(bad));
}
function isBadPath(allowed){
  if(!/^https?:$/i.test(location.protocol))return false;
  const p=location.pathname.replace(/\/+$/,"")||"/";
  return !allowed.includes(p.toLowerCase());
}
function route(keep){
  if(isBadPath(["/","/index.html","/home","/pricing","/blog"]))return go404();
  let h=location.hash.slice(1);
  const post=h.startsWith("blog-")&&POSTS.find(p=>"blog-"+p.id===h);
  const sec=SECS.includes(h);
  if(h&&!post&&!sec&&!PAGES[h])return go404();
  const pg=post?"blog":sec?"home":PAGES[h]?h:"home";
  document.documentElement.lang=LANG;

  const links=[["fitur",t("Fitur","Features"),"home"],["model",t("Model","Models"),"home"],["blog","Blog","blog"],["pricing",t("Harga","Pricing"),"pricing"]];
  $("#nav").innerHTML=links.map(([k,x,p])=>`<a href="#${k}" class="${(k===h)||(pg!=="home"&&p===pg)?"on":""}">${x}</a>`).join("");
  $("#menu").innerHTML=`<div class="m-lang"><div class="lang">${langButtons()}</div></div>`
    +[["fitur",t("Fitur","Features")],["model",t("Model","Models")],["cara",t("Cara Pakai","How it works")],["faq","FAQ"],["blog","Blog"],["pricing",t("Harga","Pricing")]].map(([k,x])=>`<a href="#${k}" class="${k===h||k===pg?"on":""}">${x}<span>→</span></a>`).join("")
    +`<a class="btn pri" href="${APP}">${t("Buka Xozen","Open Xozen")}</a>`;
  if(!$("#lang").firstChild)$("#lang").innerHTML=langButtons();
  $("#open").textContent=t("Buka Xozen","Open Xozen");
  $("#open").href=$("#open2").href=APP;
  $("#open2").textContent=t("Masuk ke aplikasi →","Open the app →");
  $("#fn").textContent=t("Xozen · Asisten AI berbahasa Indonesia.","Xozen · Your everyday AI assistant.");

  $("#app").innerHTML=post
    ?`<article class="art"><span class="eyebrow">Blog</span><h1>${esc(PO(post,"t"))}</h1><p style="color:var(--mute);margin-bottom:22px">${esc(PO(post,"s"))}</p><div>${PO(post,"b")}</div><a class="back-link" href="#blog">← ${t("Kembali ke blog","Back to blog")}</a></article>`
    :PAGES[pg]();

  document.title=(pg==="home"?"":(post?PO(post,"t"):{blog:"Blog",pricing:t("Harga","Pricing")}[pg])+" — ")+"Xozen";
  menuToggle(false);syncLangUI();initReveal();
  if(pg==="home"){renderStage();startStageLoop();startTyper()}
  else{clearInterval(stageTimer);clearTimeout(typerT)}
  $("header").classList.remove("hide");onScroll();
  if(!keep){sec&&document.getElementById(h)?document.getElementById(h).scrollIntoView():scrollTo(0,0)}
}

// Global delegated events
document.addEventListener("click",e=>{
  const lb=e.target.closest("[data-l]");
  if(lb){LANG=lb.dataset.l;try{localStorage.setItem("xz_lang",LANG)}catch(x){}route(true);return}

  const st=e.target.closest("[data-st]");
  if(st){stageIdx=+st.dataset.st;stagePct=0;renderStage();startStageLoop();return}

  const fq=e.target.closest(".faq-q");
  if(fq){
    const item=fq.closest(".faq-item"),open=item.classList.toggle("open");
    fq.setAttribute("aria-expanded",open);return;
  }

  const ch=e.target.closest(".chip");
  if(ch){
    const q=$("#q");if(!q)return;
    clearTimeout(typerT);q.focus();q.value="";
    const w=ch.dataset.p;let i=0;
    (function f(){q.value=w.slice(0,++i);fitQ();if(i<w.length)setTimeout(f,12)})();
    return;
  }
});

function fitQ(){const q=$("#q");if(!q)return;q.style.height="auto";q.style.height=Math.min(q.scrollHeight,140)+"px";$("#ask").classList.toggle("has",!!q.value.trim())}
document.addEventListener("input",e=>{if(e.target.id==="q")fitQ()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")menuToggle(false);
  if(e.target.id==="q"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#ask").requestSubmit()}
});
document.addEventListener("focusin",e=>{if(e.target.id==="q"){clearTimeout(typerT);$("#ph").textContent=t("Tanya Xozen apa saja…","Ask Xozen anything…")}});
document.addEventListener("focusout",e=>{if(e.target.id==="q"&&!e.target.value)startTyper()});
document.addEventListener("submit",e=>{
  if(e.target.id!=="ask")return;
  e.preventDefault();
  const q=$("#q"),v=(q&&q.value.trim())||"";
  if(!v){e.target.classList.remove("shake");void e.target.offsetWidth;e.target.classList.add("shake");q&&q.focus();return}
  try{sessionStorage.setItem("xz_prefill",v);localStorage.setItem("xz_prefill",v)}catch(x){}
  location.href=APP+(APP.includes("?")?"&":"?")+"q="+encodeURIComponent(v);
});

// Soft pointer light on desktop cards
document.addEventListener("pointermove",e=>{
  const c=e.target.closest&&e.target.closest(".card.lift");if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty("--mx",e.clientX-r.left+"px");
  c.style.setProperty("--my",e.clientY-r.top+"px");
},{passive:true});

$("#bg").onclick=()=>menuToggle(!document.body.classList.contains("menu-open"));
$("#scrim").onclick=()=>menuToggle(false);
$("#menu").addEventListener("click",e=>{if(e.target.closest("a"))menuToggle(false)});
addEventListener("scroll",()=>{rafId||(rafId=requestAnimationFrame(()=>{rafId=0;onScroll()}))},{passive:true});
addEventListener("hashchange",()=>route());

$("#fav").href=LOGO;
document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);
route();
</script>
